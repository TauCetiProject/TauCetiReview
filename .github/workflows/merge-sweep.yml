name: merge-sweep

# Re-drive green PRs that the merge queue evicted, so an eviction is never terminal. auto-merge.yml
# enqueues a PR once per triggering event; if the queue then evicts it (a merge group that could not
# form, or a rebuild against a moved main that failed), nothing re-drives an otherwise-idle green PR and
# it strands — green on every rubric, never merged. This scheduled sweep re-enqueues such PRs (reusing
# the EXISTING head-pinned review — no re-review, no provider keys, no spend), and for a head the queue
# has repeatedly rejected, updates the branch onto main (re-test + re-review) or flags a conflict. The
# merge decision is the same decide_from_comments the merge-only path uses, so the sweep can never
# enqueue something the normal gate would refuse. Like merge-only, this runs no reviewer and mints only
# the App credentials the merge needs.

# MERGE_BACKEND=direct retries direct merges, without a queue or branch updates.

on:
  workflow_call:
    inputs:
      tools_repository: {required: false, type: string, default: TauCetiProject/TauCetiTools}
      tools_ref: {required: false, type: string, default: ""}
      dry_run:
        description: "List actions without enqueuing / updating / flagging"
        type: boolean
        default: false
      focused:
        description: "Inspect approvals and ready/recovery hints; hourly scans inspect other PRs too"
        type: boolean
        default: false
      review_ref:
        description: "Full TauCetiReview commit SHA, matching the caller workflow pin."
        type: string
        default: ""
    secrets:
      APP_ID: { required: true }
      APP_PRIVATE_KEY: { required: true }

permissions:
  contents: read

concurrency:
  group: tauceti-merge-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # An empty ref would make checkout fall back to TauCetiReview's default branch, silently
      # running unpinned code; refuse instead.
      - name: Require a pinned review ref
        env: { REVIEW_REF: "${{ inputs.review_ref }}" }
        run: |
          if ! [[ "$REVIEW_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::review_ref must be supplied as the pinned engine commit"; exit 1
          fi

      - name: Checkout review repo (runner)
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiReview
          # The explicit full commit SHA pinned by the caller.
          ref: ${{ inputs.review_ref }}
          persist-credentials: false

      # contents:write to enqueue (as a queue bypass actor) and update-branch; pull-requests:write to
      # label / comment when flagging. workflows:write is needed when updating a stale
      # PR branch brings in workflow changes already on main (GitHub rejects update-branch
      # without it even for a Lean-only PR). This job runs only the trusted, pinned runner,
      # never checks out or executes PR code, and scopes the token to TauCeti only.
      # The App registration AND its installation must approve this permission first;
      # see docs/merge-sweep-permissions.md. Other merge/review tokens remain narrower.
      - name: Install engine dependencies for legacy callers
        if: inputs.tools_ref == ''
        run: python3 -m pip install .

      - name: Checkout pinned common configuration tools
        if: inputs.tools_ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tools_repository }}
          ref: ${{ inputs.tools_ref }}
          path: .tauceti-tools
          persist-credentials: false
      - name: Checkout trusted caller project configuration
        if: inputs.tools_ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tauceti.toml
          sparse-checkout-cone-mode: false
          path: .tauceti-project
          persist-credentials: false
      - name: Bind this workflow to the configured project
        if: inputs.tools_ref != ''
        env:
          PYTHONPATH: ${{ github.workspace }}/.tauceti-tools
        run: |
          python3 -m tauceti_tools config environment --conf .tauceti-project/tauceti.toml --github-env "$GITHUB_ENV"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Mint merge-sweep token (TauCeti branch-update permissions)
        id: merge_token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1; v1 ignores permission-* inputs
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.TAUCETI_CONTENT_NAME || 'TauCeti' }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
          permission-issues: write  # create recovery/reservation labels when absent
          permission-workflows: write
        env:
          INPUT_PERMISSION-ACTIONS-VARIABLES: read

      # This cache only orders observations. An outage or malformed checkpoint
      # must never prevent the shared policy from publishing current decisions.
      - name: Restore sweep progress
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/tauceti-merge-sweep-progress.json
          key: merge-sweep-progress-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: merge-sweep-progress-v1-${{ github.repository_id }}-

      - name: Re-drive evicted green PRs
        env:
          GH_TOKEN: ${{ steps.merge_token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FOCUSED: ${{ inputs.focused && '1' || '' }}
          SWEEP_PROGRESS_FILE: ${{ runner.temp }}/tauceti-merge-sweep-progress.json
        run: python3 runner/sweep.py

      - name: Save sweep progress
        if: always() && !inputs.dry_run
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/tauceti-merge-sweep-progress.json
          key: merge-sweep-progress-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
