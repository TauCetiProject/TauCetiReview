name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ github.repository == 'TauCetiProject/TauCetiReview' && fromJSON(format('["nscloud-ubuntu-24.04-amd64-2x4-with-features","namespace-features:github.run-id={0}"]', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install the pinned shared configuration, byte-compile, then run price-coverage
      # checks (every dispatchable model must be priced; prices.json must be well-formed).
      - run: python -m pip install "tauceti-tools @ git+https://github.com/TauCetiProject/TauCetiTools@598d0d48b7e3670b932744de8b1d435db55a7b61"
      - run: python -m py_compile runner/*.py
      - run: python tests/test_ledger.py
      - run: python tests/test_cli.py
      - run: python tests/test_coordinate.py
      - run: python tests/test_scoreboard_metadata.py
      - run: python tests/test_prices.py
      - run: python tests/test_token_accounting.py
      - run: python tests/test_post.py
      - run: python tests/test_shared_publication.py
      - run: python tests/test_shared_cli.py
      - run: python tests/test_billing.py
      - run: python tests/test_unchanged_review.py
      - run: python tests/test_completed_handoff.py
      - run: python tests/test_early_handoff.py
      - run: python tests/test_thread_states.py
      - run: python tests/test_patch_digest.py
      - run: python tests/test_seed_approvals.py
      - run: python tests/test_pr_diff.py
      - run: python tests/test_source_preparation.py
      - run: python tests/test_source_cache.py
      - run: python tests/test_diff_context.py
      - run: python tests/test_admission_policy.py
      - run: python tests/test_sweep.py
      - run: python tests/test_sweep_budget.py
      - run: python tests/test_direct_merge.py
      - run: python tests/test_backend.py
      - run: python tests/test_eligibility.py
      - run: python tests/test_codex_fallback.py
      - run: python tests/test_reviewer_env.py
      - run: python tests/test_kiro.py
      - run: python tests/test_attempt_diagnostics.py
      - run: python tests/test_provider_down.py
      - run: python tests/test_tool_trace.py
      - run: python tests/test_sandbox_check.py
      - run: python tests/test_reviewer_no_shell.py
      - run: python tests/test_prompt_refs.py
      - run: python tests/test_prompt_cache.py
