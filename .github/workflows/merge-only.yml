name: merge-only

# A cheap, no-dispatch queue reconciler: require every scoreboard at the current head to be green and
# no review to be in progress. Enqueue when that review state and the path policy permit it; dequeue
# when the review state becomes unsafe.
# Generates NO reviews, stages NO provider keys, and runs NO reviewer — reviews are produced by the
# operator-run worker or by people running tauceti-review locally. This keeps auto-merge automatic
# with expensive CI review generation off.
#
# Enqueue, not direct merge: the queue retests each entry against the CURRENT main and merges in
# order, so an approved PR that has fallen behind main is retested and merged without any re-review,
# rather than stranded (as it was when this merged directly and skipped BEHIND PRs).

on:
  workflow_call:
    inputs:
      pr: { required: true, type: string }
      review_ref: { required: false, type: string, default: main }
    secrets:
      # Only the App credentials the merge needs — the caller passes these explicitly rather than
      # inheriting all of TauCeti's secrets into this public-triggerable path.
      APP_ID: { required: true }
      APP_PRIVATE_KEY: { required: true }

permissions:
  contents: read

concurrency:
  group: tauceti-merge-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      PR: ${{ inputs.pr }}
    steps:
      # No provider keys, no reviewer step — nothing here runs PR-influenced code, so the
      # security posture is simpler than review.yml: only trusted GitHub-derived inputs.
      - name: Checkout review repo (runner + rubrics)
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiReview
          ref: ${{ inputs.review_ref }}
          persist-credentials: false

      - name: Resolve PR head and fetch diff
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          HEAD_SHA=$(gh pr view "$PR" --repo TauCetiProject/TauCeti --json headRefOid -q .headRefOid)
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          BASE_SHA=$(gh pr view "$PR" --repo TauCetiProject/TauCeti --json baseRefOid -q .baseRefOid)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          MERGE_BASE=$(gh api "/repos/TauCetiProject/TauCeti/compare/${BASE_SHA}...${HEAD_SHA}" \
            --jq '.merge_base_commit.sha' 2>/dev/null || echo "")
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"
          echo "RUBRICS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # `build`, `bump-guard`, and `scope` are the authoritative commit STATUSES that trusted
          # base CI posts, so read them by `.context`/`.state`, not
          # the job CheckRun (whose name differs — bump-guard's job is "guard"). Missing -> "" -> the
          # engine refuses to merge. Posted by the trusted base-repo CI; external authors cannot write
          # statuses to the base repo.
          CI_BUILD=$(gh pr view "$PR" --repo TauCetiProject/TauCeti --json statusCheckRollup \
            -q '[.statusCheckRollup[]? | select(.__typename=="StatusContext" and .context=="build") | .state] | first // ""')
          echo "CI_BUILD=$CI_BUILD" >> "$GITHUB_ENV"
          BUMP_GUARD=$(gh pr view "$PR" --repo TauCetiProject/TauCeti --json statusCheckRollup \
            -q '[.statusCheckRollup[]? | select(.__typename=="StatusContext" and .context=="bump-guard") | .state] | first // ""')
          echo "BUMP_GUARD=$BUMP_GUARD" >> "$GITHUB_ENV"
          SCOPE=$(gh pr view "$PR" --repo TauCetiProject/TauCeti --json statusCheckRollup \
            -q '[.statusCheckRollup[]? | select(.__typename=="StatusContext" and .context=="scope") | .state] | first // ""')
          echo "SCOPE=$SCOPE" >> "$GITHUB_ENV"
          gh pr diff "$PR" --repo TauCetiProject/TauCeti > diff.txt
          echo "diff lines: $(wc -l < diff.txt)"

      - name: Fetch this PR's review comments
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          # The merge gate's verdict source is the PR's review COMMENTS: every reviewer (the worker,
          # or anyone running tauceti-review with no repo write) posts one carrying a tauceti-meta:v1
          # block with head_sha + a full per-rubric `states` map. No access bar: a contributor's review
          # counts via their posted comment. The hard boundary a forged scoreboard cannot bypass remains
          # the build + scope + bump-guard checks below.
          # Fetch ALL comments: an external reviewer can't edit the worker's scoreboard comment, so
          # they post their OWN — which on a busy PR could be past page 1. Every current-head
          # scoreboard must be considered, so a single page could hide one.
          # `--paginate` with a non-array --jq
          # emits one JSON object per line (JSONL), concatenated across pages (a bare --paginate would
          # concatenate per-page arrays into invalid JSON; --slurp can't combine with --jq).
          gh api --paginate "repos/TauCetiProject/TauCeti/issues/$PR/comments" \
            --jq '.[] | {body, updated_at, created_at}' > comments.json
          echo "fetched $(wc -l < comments.json) comment(s) for #$PR"

      - name: Compute queue decision from the review comments (no dispatch, no spend)
        run: |
          set -euo pipefail
          # Review-safe iff at least one scoreboard is at the current head, every scoreboard there has
          # every required rubric green, and no live review marker claims that head. Mergeable also
          # requires the shared decide_merge rule (build + scope green,
          # TauCeti/-only + allowed root/pins, bump-guard for a pin). Reads the full `states` from the meta, falling back
          # to the rendered table for comments posted before that field existed.
          python3 runner/merge_from_scoreboard.py \
            --repo TauCetiProject/TauCeti --pr "$PR" --head-sha "$HEAD_SHA" --comments-file comments.json \
            --diff-file diff.txt --ci-build "$CI_BUILD" --bump-guard "$BUMP_GUARD" --scope "$SCOPE" \
            --merge-decision-file "$PWD/merge.json"

      # ---- Auto-merge: mint the scoped merge token only now, and merge iff the decision is green.
      # ---- The App must be a ruleset bypass actor and hold TauCeti contents:write for it to land.
      - name: Mint merge token (TauCeti contents + pull-requests write)
        id: merge_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-contents: write
          permission-pull-requests: write

      - name: Reconcile the merge queue
        env:
          GH_TOKEN: "${{ steps.merge_token.outputs.token }}"
          REPO: TauCetiProject/TauCeti
        run: |
          set -euo pipefail
          # Re-read state immediately before either mutation and bind enqueue to the reviewed head.
          read -r CUR_HEAD PRID < <(gh pr view "$PR" --repo TauCetiProject/TauCeti \
            --json headRefOid,id -q '.headRefOid + " " + .id')

          dequeue() {
            echo "dequeueing #$PR: $1"
            if out=$(gh api graphql -f query='mutation($id: ID!) {
              dequeuePullRequest(input: { id: $id }) { mergeQueueEntry { position } }
            }' -f id="$PRID" 2>&1); then
              echo "$out"; echo "dequeued #$PR."
            else
              echo "$out"
              if printf '%s' "$out" | grep -qiE 'not in the (merge )?queue|already merged|could not resolve|not found'; then
                echo "dequeue not applied (already absent from the queue)."
              else
                echo "::error::unexpected dequeue failure for #$PR"; exit 1
              fi
            fi
          }

          if [ ! -f merge.json ]; then
            echo "::error::no queue decision file"; exit 1
          fi
          REASON=$(jq -r '.reason // "no reason"' merge.json)
          if [ "$(jq -r .review_safe merge.json)" != "true" ]; then
            dequeue "$REASON"
            exit 0
          fi
          if [ "$(jq -r .merge merge.json)" != "true" ]; then
            echo "review state is safe, but not automatically enqueuing: $REASON"
            exit 0
          fi
          if [ "$CUR_HEAD" != "$HEAD_SHA" ]; then
            dequeue "head moved ($HEAD_SHA -> $CUR_HEAD) since the decision"
            exit 0
          fi
          # ---- merge-queue reservation (runner/queue_reservation.py explains why) ----
          # A pin-moving PR rebuilds everything (83-95 min) and is evicted by anything landing under
          # it that the new mathlib deprecates, so it gets the queue to itself. A failure to READ the
          # queue is fatal here on purpose: enqueuing into a queue whose state we do not know is
          # exactly what the reservation exists to prevent.
          if ! HOLDER=$(python3 runner/queue_reservation.py holder); then
            echo "::error::cannot read the merge queue; refusing to enqueue"; exit 1
          fi
          PIN_MOVING=0
          # REST + --paginate, not `gh pr view --json files`: a bump changes more than one page of
          # files (143 for v4.34.0-rc1), and a truncated list would read as "not pin-moving".
          if gh api --paginate "/repos/TauCetiProject/TauCeti/pulls/$PR/files?per_page=100" \
               --jq '.[].filename' | grep -qxE 'lake-manifest\.json|lean-toolchain'; then
            PIN_MOVING=1
          fi
          if [ -n "$HOLDER" ] && [ "$HOLDER" != "$PR" ]; then
            echo "not enqueuing: merge queue reserved for pin-moving #$HOLDER (a later trigger retries)."
            exit 0
          fi
          if [ "$PIN_MOVING" = 1 ]; then
            # Clear BEFORE enqueuing, never after: an entry already ahead of this one can merge in
            # the window between the two, and no later dequeue undoes a commit that has landed.
            echo "#$PR moves the Lake pins; clearing the merge queue so it rebuilds alone."
            python3 runner/queue_reservation.py clear --for "$PR" || {
              echo "::error::could not clear the merge queue for #$PR"; exit 1; }
          fi
          # Hand the PR to the merge queue rather than merging directly. The queue retests it against
          # the CURRENT main (the merge_group build + bump-guard) and merges in order, so a PR that has
          # fallen BEHIND is retested and merged without any re-review, instead of being stranded as it
          # was when we merged here directly and skipped behind PRs. The App is a queue + review bypass
          # actor, so enqueuing as it clears the code-owner gate the AI-reviewed TauCeti/ math PRs skip.
          #
          # expectedHeadOid binds the enqueue to the exact reviewed commit (the old --match-head-commit
          # guarantee): if the author races a new push in between, the mutation is rejected rather than
          # queueing an un-reviewed commit. The CUR_HEAD check above is just a cheaper early-out.
          echo "enqueuing #$PR ($CUR_HEAD): $(jq -r .reason merge.json)"
          if out=$(gh api graphql -f query='
            mutation($prId: ID!, $headOid: GitObjectID!) {
              enqueuePullRequest(input: { pullRequestId: $prId, expectedHeadOid: $headOid }) {
                mergeQueueEntry { position state }
              }
            }' -f prId="$PRID" -f headOid="$HEAD_SHA" 2>&1); then
            echo "$out"; echo "enqueued #$PR."
          else
            echo "$out"
            # Benign, retried on the next build / scoreboard event: already in the queue, the head
            # moved (expectedHeadOid mismatch), or GitHub does not currently consider it mergeable.
            # Anything else (auth, permissions, queue disabled, malformed query) is a real fault: fail
            # loudly so a broken merge path is visible rather than silently never merging.
            if printf '%s' "$out" | grep -qiE 'already queued|already in the merge queue|already in the queue|expected head|head .*(moved|changed|match)|not mergeable|mergeable state'; then
              echo "enqueue not applied (already queued / head moved / not yet mergeable) — a later trigger retries."
            else
              echo "::error::unexpected enqueue failure for #$PR"; exit 1
            fi
          fi
